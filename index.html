<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match List – CTEEA Ridgefield HS Blended Qualifier</title>
<meta name="description" content="Qualification match schedule – CTEEA Ridgefield HS Blended Qualifier, Nov 7">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14161a;--muted:#5f6670;--line:#e2e5ea;
--red:#d62b2b;--red-bg:#fde8e8;--red-ink:#a11d1d;--blue:#1f5fd6;--blue-bg:#e5eefe;--blue-ink:#163f91;--hl:#ffd84d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eef0f3;--muted:#9aa2ad;--line:#2a2f37;
--red-bg:#3a1616;--red-ink:#ff9a9a;--blue-bg:#14223f;--blue-ink:#9cbcff}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 16px 8px;max-width:980px;margin:0 auto}
h1{margin:0;font-size:1.5rem}
.sub{color:var(--muted);margin-top:4px;font-size:.95rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;max-width:980px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
select,input,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#msBtn{min-width:150px;text-align:left}
.ms{position:relative}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:10;width:220px;max-height:60vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.ms-panel[hidden]{display:none}
.ms-head{padding:6px;border-bottom:1px solid var(--line)}
.ms-head button{padding:5px 10px;font-size:.85rem}
.ms-list{overflow:auto;padding:4px 0}
.ms-list label{display:flex;gap:10px;align-items:center;padding:7px 12px;cursor:pointer}
.ms-list label:hover{background:var(--bg)}
.ms-list input{padding:0;margin:0;width:18px;height:18px;accent-color:var(--ink)}
button{cursor:pointer}
.chips{display:flex;gap:6px}
.chip.on{background:var(--ink);color:var(--bg)}
.summary{max-width:980px;margin:10px auto 0;padding:0 16px;color:var(--muted);font-size:.92rem;min-height:1.2em}
main{max-width:980px;margin:0 auto;padding:12px 16px 40px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
th.r{color:#fff;background:var(--red)}th.b{color:#fff;background:var(--blue)}
td.r{background:var(--red-bg);color:var(--red-ink);font-weight:700}
td.b{background:var(--blue-bg);color:var(--blue-ink);font-weight:700}
td.m{font-weight:700}
.team{cursor:pointer;border-radius:6px;padding:2px 6px}
.team.sel{background:var(--hl);color:#000;outline:2px solid #000}
.nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav button{padding:9px 14px}
#cur{font-weight:700;min-width:5.5em;text-align:center;cursor:pointer}
tr.cur td.m{background:var(--hl);color:#000}
tr.cur td.m::after{content:" NOW";font-size:.65rem;background:#000;color:#fff;padding:2px 5px;border-radius:5px;margin-left:6px;vertical-align:middle}
.field{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bg);font-size:.85rem}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:0 16px 30px}
/* Mobile cards */
@media (max-width:680px){
 table,thead,tbody,tr,td{display:block}thead{display:none}
 table{background:none;box-shadow:none}
 tr{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
 td{border:none;padding:8px 12px}
 td.m{grid-column:1}td.t{grid-column:2;text-align:right;color:var(--muted)}
 td.f{grid-column:1/3;padding-top:0}
 td.r,td.b{text-align:center;font-size:1.05rem}
 td.r::before{content:"RED";display:block;font-size:.65rem;letter-spacing:.06em;opacity:.7}
 td.b::before{content:"BLUE";display:block;font-size:.65rem;letter-spacing:.06em;opacity:.7}
}
</style>
</head>
<body>
<header>
 <h1>Match List</h1>
 <div class="sub">RECF Achieve · CTEEA Ridgefield HS Blended Qualifier · 72 qualification matches · Nov 7</div>
</header>
<div class="bar">
 <div class="ms">
  <button id="msBtn" aria-haspopup="true" aria-expanded="false" aria-label="Filter by teams">All teams ▾</button>
  <div class="ms-panel" id="msPanel" hidden>
   <div class="ms-head"><button id="msClear">Clear all</button></div>
   <div class="ms-list" id="msList"></div>
  </div>
 </div>
 <div class="chips">
  <button class="chip on" data-f="">All fields</button>
  <button class="chip" data-f="Technology">Tech</button>
  <button class="chip" data-f="Engineering">Eng</button>
  <button class="chip" data-f="Design">Design</button>
 </div>
 <div class="nav">
  <button id="prev" aria-label="Previous match">◀</button>
  <span id="cur" title="Jump to current match"></span>
  <button id="next" aria-label="Next match">▶</button>
 </div>
</div>
<div class="summary" id="summary"></div>
<main>
<table>

 <tbody id="rows"></tbody>
</table>
</main>
<footer>Tap any team number to add or remove it from the filter. Times are local (Nov 7, 2026).</footer>

},{"m":"Q24","t":"10:26 AM","f":"Design","r":["1697A","17814V"],"b":["18478A","4478Y"]},{"m":"Q25","t":"10:30 AM","f":"Technology","r":["1387B","4478P"],"b":["1695E","5150D"]},{"m":"Q26","t":"10:33 AM","f":"Engineering","r":["1387A","21860E"],"b":["21860K","4478N"]},{"m":"Q27","t":"10:37 AM","f":"Design","r":["1695F","21860T"],"b":["4478A","4478J"]},{"m":"Q28","t":"10:41 AM","f":"Technology","r":["1697A","9909D"],"b":["4478V","4478X"]},{"m":"Q29","t":"10:45 AM","f":"Engineering","r":["1697B","4478H"],"b":["5150T","90722A"]},{"m":"Q30","t":"10:48 AM","f":"Design","r":["1695A","877J"],"b":["5150F","877K"]},{"m":"Q31","t":"10:52 AM","f":"Technology","r":["17814X","4478Y"],"b":["5150K","9909E"]},{"m":"Q32","t":"10:56 AM","f":"Engineering","r":["18478A","4478Z"],"b":["4478W","877D"]},{"m":"Q33","t":"11:00 AM","f":"Design","r":["17814U","5017C"],"b":["17814V","9909K"]},{"m":"Q34","t":"11:03 AM","f":"Technology","r":["21860B","5017D"],"b":["17814W","5017B"]},{"m":"Q35","t":"11:07 AM","f":"Engineering","r":["1695C","4478T"],"b":["17814Y","9909H"]},{"m":"Q36","t":"11:11 AM","f":"Design","r":["1695B","877H"],"b":["17814Z","5150J"]},{"m":"Q37","t":"11:15 AM","f":"Technology","r":["4478J","5150D"],"b":["1695A","9909E"]},{"m":"Q38","t":"11:18 AM","f":"Engineering","r":["1387B","17814V"],"b":["5150K","5150T"]},{"m":"Q39","t":"11:22 AM","f":"Design","r":["18478A","9909H"],"b":["5017B","877K"]},{"m":"Q40","t":"11:26 AM","f":"Technology","r":["4478N","4478V"],"b":["17814X","21860B"]},{"m":"Q41","t":"11:30 AM","f":"Engineering","r":["1387A","9909K"],"b":["4478T","877D"]},{"m":"Q42","t":"11:33 AM","f":"Design","r":["17814Z","4478Y"],"b":["4478H","4478P"]},{"m":"Q43","t":"11:37 AM","f":"Technology","r":["17814Y","5150F"],"b":["17814U","21860T"]},{"m":"Q44","t":"11:41 AM","f":"Engineering","r":["1695B","21860K"],"b":["4478A","877J"]},{"m":"Q45","t":"11:45 AM","f":"Design","r":["1695F","5150J"],"b":["1695E","5017C"]},{"m":"Q46","t":"11:48 AM","f":"Technology","r":["1697A","4478Z"],"b":[" 78A"],"b":["5017D","877J"]},{"m":"Q70","t":"1:18 PM","f":"Technology","r":["17814U","4478W"],"b":["4478Y","5150J"]},{"m":"Q71","t":"1:22 PM","f":"Engineering","r":["1695C","5150T"],"b":["4478P","5017C"]},{"m":"Q72","t":"1:26 PM","f":"Design","r":["4478Z","90722A"],"b":["1695E","4478H"]}];
const teams=[...new Set(M.flatMap(x=>[...x.r,...x.b]))].sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b));
const picked=new Set();
const msBtn=document.getElementById('msBtn'),msPanel=document.getElementById('msPanel'),msList=document.getElementById('msList');
msList.innerHTML=teams.map(t=>`<label><input type="checkbox" value="${t}">${t}</label>`).join('');
let field='';let cur=0;
try{const c=parseInt(localStorage.getItem('cur'));if(c>=0&&c<M.length)cur=c}catch(e){}
try{const s=JSON.parse(localStorage.getItem('teams')||'[]');s.forEach(t=>teams.includes(t)&&picked.add(t))}catch(e){}
const q=new URLSearchParams(location.search).get('team');
if(q){const qs=q.toUpperCase().split(',').filter(t=>teams.includes(t));if(qs.length){picked.clear();qs.forEach(t=>picked.add(t))}}
function cell(t,c){return `<td class="${c}"><span class="team${picked.has(t)?' sel':''}" data-t="${t}">${t}</span></td>`}
function render(){
 const list=M.filter(x=>(!picked.size||[...x.r,...x.b].some(t=>picked.has(t)))&&(!field||x.f===field));
 document.getElementById('rows').innerHTML=list.map(x=>
  `<tr id="m${M.indexOf(x)}"${M.indexOf(x)===cur?' class="cur"':''}><td class="m">${x.m}</td><td class="t">${x.t}</td><td class="f"><span class="field">${x.f}</span></td>`+
   x.r.map(t=>cell(t,'r')).join('')+x.b.map(t=>cell(t,'b')).join('')+`</tr>`).join('');
 document.getElementById('cur').textContent=`Now: ${M[cur].m}`;
 document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===M.length-1;
 msList.querySelectorAll('input').forEach(c=>c.checked=picked.has(c.value));
 const names=[...picked];
 msBtn.textContent=(names.length===0?'All teams':names.length<=2?names.join(', '):`${names.length} teams`)+' ▾';
 const s=document.getElementById('summary');const n=`${list.length} match${list.length===1?'':'es'} shown`;
 if(names.length===1){const team=names[0];const rc=list.filter(x=>x.r.includes(team)).length;s.textContent=`${team}: ${n} · ${rc} red, ${list.length-rc} blue`}
 else if(names.length>1)s.textContent=`${names.join(', ')}: ${n}`;
 else s.textContent=n;
 try{localStorage.setItem('teams',JSON.stringify(names))}catch(e){}
}
function step(d){cur=Math.max(0,Math.min(M.length-1,cur+d));try{localStorage.setItem('cur',cur)}catch(e){}render();showCur()}
function showCur(){const r=document.getElementById('m'+cur);if(r)r.scrollIntoView({behavior:'smooth',block:'center'})}
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('cur').onclick=showCur;
function toggle(t){picked.has(t)?picked.delete(t):picked.add(t)}
function openPanel(o){msPanel.hidden=!o;msBtn.setAttribute('aria-expanded',o)}
msBtn.onclick=()=>openPanel(msPanel.hidden);
msList.onchange=e=>{toggle(e.target.value);render()};
document.getElementById('msClear').onclick=()=>{picked.clear();render()};
document.addEventListener('click',e=>{if(!e.target.closest('.ms'))openPanel(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')openPanel(false)});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');field=b.dataset.f;render()});
document.getElementById('rows').onclick=e=>{const t=e.target.closest('.team');if(t){toggle(t.dataset.t);render();scrollTo({top:0,behavior:'smooth'})}};
render();
</script>
</body>
</html>
